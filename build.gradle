plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    exclude '**/icon_base64.txt'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    doLast {
        def src = project.file('src/main/resources/assets/superoptimizer/icon_base64.txt')
        def out = project.file(destinationDir.toString() + '/assets/superoptimizer/icon.png')
        out.parentFile.mkdirs()
        out.bytes = src.text.trim().decodeBase64()
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
