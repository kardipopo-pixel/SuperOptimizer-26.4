name: Build Memento

on:
  push:
    branches: [ surprise-autotuner ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build
        run: gradle --no-daemon clean build
      - name: Verify Memento jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'fabric.mod.json'
          jar tf "$JAR" | grep -q 'dev/kardipopo/memento/MementoClient.class'
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "memento"'
      - name: Upload Memento jar
        uses: actions/upload-artifact@v4
        with:
          name: Memento-26.4-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14