name: Build SuperOptimizer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build with real Fabric/Minecraft dependencies
        run: gradle --no-daemon clean build
      - name: Verify 26.4 API and production JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(python scripts/find_minecraft_client_jar.py)"

          javap -classpath "$JAR" -p net.minecraft.client.renderer.LevelRenderer |
            grep -q 'submitEntities'
          javap -classpath "$JAR" -p net.minecraft.client.renderer.LevelRenderer |
            grep -q 'submitBlockEntities'
          javap -classpath "$JAR" -p net.minecraft.client.renderer.entity.EntityRenderDispatcher |
            grep -q 'submit'
          javap -classpath "$JAR" -p net.minecraft.client.renderer.chunk.SectionRenderDispatcher\$RenderSection |
            grep -q 'getRenderOrigin'
          javap -classpath "$JAR" -p net.minecraft.client.renderer.SectionOcclusionGraph |
            grep -q 'expectedChunks'

          MOD_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$MOD_JAR"
          python - "$MOD_JAR" <<'PY'
import json
import sys
import zipfile

jar_path = sys.argv[1]
with zipfile.ZipFile(jar_path) as z:
    names = set(z.namelist())
    data = json.loads(z.read("fabric.mod.json"))
    assert data["id"] == "superoptimizer"
    assert "superoptimizer.mixins.json" in data["mixins"]
    assert "dev/kardipopo/superoptimizer/mixin/LevelRendererEntityCullingMixin.class" in names
    assert "dev/kardipopo/superoptimizer/mixin/LevelRendererBlockEntityCullingMixin.class" in names
    assert "dev/kardipopo/superoptimizer/mixin/MinecraftClientTickMixin.class" not in names
    assert not any(n.endswith(".java") for n in names)

    class_bytes = z.read("dev/kardipopo/superoptimizer/SuperOptimizerClient.class")
    major = int.from_bytes(class_bytes[6:8], "big")
    assert major == 69, f"Expected Java 25 class file major 69, got {major}"

print("Production JAR checks passed:", jar_path)
PY

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SuperOptimizer-26.4-alpha.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
