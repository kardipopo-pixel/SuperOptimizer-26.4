name: Build SuperOptimizer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build with real Fabric/Minecraft dependencies
        run: gradle --no-daemon clean build
      - name: Inspect 26.4 rendering API
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(python scripts/find_minecraft_client_jar.py)"
          echo "Minecraft client jar: $JAR"
          echo "== EntityRenderDispatcher =="
          javap -classpath "$JAR" -p net.minecraft.client.renderer.entity.EntityRenderDispatcher
          echo "== LevelRenderer =="
          javap -classpath "$JAR" -p net.minecraft.client.renderer.LevelRenderer
          echo "== LevelRenderState =="
          javap -classpath "$JAR" -p net.minecraft.client.renderer.state.level.LevelRenderState
          echo "== EntityRenderState =="
          javap -classpath "$JAR" -p net.minecraft.client.renderer.entity.state.EntityRenderState
          echo "== BlockEntityRenderState =="
          javap -classpath "$JAR" -p net.minecraft.client.renderer.blockentity.state.BlockEntityRenderState
          echo "== LevelRenderer.submitEntities bytecode =="
          javap -classpath "$JAR" -p -c net.minecraft.client.renderer.LevelRenderer | awk '/private void submitEntities\(/,/private void submitBlockEntities\(/' | sed -n '1,900p'
          echo "== LevelRenderer.submitBlockEntities bytecode =="
          javap -classpath "$JAR" -p -c net.minecraft.client.renderer.LevelRenderer | awk '/private void submitBlockEntities\(/,/private void submitBlockDestroyAnimation\(/' | sed -n '1,900p'
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SuperOptimizer-26.4-alpha.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
