name: Build SuperOptimizer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build with real Fabric/Minecraft dependencies
        run: gradle --no-daemon clean build
      - name: Verify 26.4 API and production JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(python scripts/find_minecraft_client_jar.py)"

          javap -classpath "$JAR" -p net.minecraft.client.renderer.LevelRenderer |
            grep -q 'submitEntities'
          javap -classpath "$JAR" -p net.minecraft.client.renderer.LevelRenderer |
            grep -q 'submitBlockEntities'
          javap -classpath "$JAR" -p net.minecraft.client.renderer.entity.EntityRenderDispatcher |
            grep -q 'submit'
          javap -classpath "$JAR" -p 'net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection' |
            grep -q 'getRenderOrigin'
          javap -classpath "$JAR" -p net.minecraft.client.renderer.SectionOcclusionGraph |
            grep -q 'expectedChunks'

          python scripts/verify_production_jar.py

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SuperOptimizer-26.4-alpha.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
