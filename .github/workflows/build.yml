name: Build SuperOptimizer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build with real Fabric/Minecraft dependencies
        run: gradle --no-daemon clean build
      - name: Inspect 26.4 rendering classes
        shell: bash
        run: |
          set -e
          echo "== Candidate Minecraft client jars =="
          find "$HOME/.gradle/caches" -type f -name '*.jar' | grep -E '26\.4|minecraft' | head -80 || true

          JAR="$(find "$HOME/.gradle/caches" -type f -name '*.jar' | while read -r f; do
            if jar tf "$f" 2>/dev/null | grep -q '^net/minecraft/client/renderer/entity/EntityRenderDispatcher.class
        uses: actions/upload-artifact@v4
        with:
          name: SuperOptimizer-26.4-alpha.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
; then
              echo "$f"
              break
            fi
          done)"
          if [ -z "$JAR" ]; then
            echo "EntityRenderDispatcher jar not found"
            exit 1
          fi
          echo "Using: $JAR"
          echo "== EntityRenderDispatcher =="
          javap -classpath "$JAR" -p net.minecraft.client.renderer.entity.EntityRenderDispatcher | sed -n '1,220p'
          echo "== LevelRenderer =="
          javap -classpath "$JAR" -p net.minecraft.client.renderer.LevelRenderer | sed -n '1,260p'
          echo "== WorldRenderState =="
          javap -classpath "$JAR" -p net.minecraft.client.renderer.state.level.LevelRenderState | sed -n '1,180p'
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SuperOptimizer-26.4-alpha.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
