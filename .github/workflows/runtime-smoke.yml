name: Runtime smoke test

on:
  workflow_run:
    workflows: ["Build SuperOptimizer"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Run client smoke test under Xvfb
        shell: bash
        run: |
          set +e
          timeout 120s xvfb-run -a gradle --no-daemon runClient > runtime-smoke.log 2>&1
          rc=$?
          echo "runClient exit code: $rc"
          grep -E "SuperOptimizer 26\.4|Game version|Fabric Loader" runtime-smoke.log | tail -50 || true

          # runClient is expected to stay alive; timeout 124 is acceptable only
          # if our initializer was actually reached.
          if grep -q "SuperOptimizer 26\.4:" runtime-smoke.log; then
            echo "SuperOptimizer initializer reached."
            exit 0
          fi

          echo "Initializer marker was not found."
          tail -200 runtime-smoke.log
          exit 1
      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-log
          path: runtime-smoke.log
          if-no-files-found: error
          retention-days: 14
